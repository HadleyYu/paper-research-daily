[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-research-daily"
version = "0.2.0"
description = "Portable, evidence-first literature curation tools for AI agents"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pypdf>=5,<7", "tzdata>=2024.1"]
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
paper-daily = "paper_daily.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
